baseURL = "https://tephrasec.tech/"
languageCode = "en"
title = "Tephra"
enableRobotsTXT = true
enableGitInfo = false

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[markup.goldmark.renderer]
  unsafe = false
[markup.highlight]
  noClasses = false

[menu]
  [[menu.main]]
    name = "Docs"
    pageRef = "/docs"
    weight = 1
  [[menu.main]]
    name = "Rules"
    pageRef = "/rules"
    weight = 2
  [[menu.main]]
    name = "Results"
    pageRef = "/results"
    weight = 3
  [[menu.main]]
    name = "Search"
    weight = 4
    [menu.main.params]
      type = "search"
  [[menu.main]]
    name = "GitHub"
    weight = 5
    url = "https://github.com/tephrasec/tephra"
    [menu.main.params]
      icon = "github"

[params]
  description = "eBPF runtime security for Kubernetes that stays on guard when someone tries to blind it."
  [params.navbar]
    displayTitle = true
    displayLogo = true
    [params.navbar.logo]
      path = "images/logo.svg"
      dark = "images/logo.svg"
      width = 28
      height = 28
  [params.theme]
    default = "dark"
    displayToggle = true
  [params.page]
    width = "wide"
  [params.footer]
    enable = true
    displayCopyright = false
    displayPoweredBy = false
  [params.editURL]
    enable = true
    base = "https://github.com/tephrasec/website/edit/main/content"
  [params.search]
    enable = true
    type = "flexsearch"
